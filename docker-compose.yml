version: '3.9'

services:
  frontend:
    build: .
    command: npm --prefix frontend run dev -- --host 0.0.0.0 --port 5173
    ports:
      - '5173:5173'
    environment:
      VITE_API_BASE_URL: http://localhost:3001
    depends_on:
      - api

  api:
    build: .
    command: npm --prefix server run dev
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      NODE_ENV: development
